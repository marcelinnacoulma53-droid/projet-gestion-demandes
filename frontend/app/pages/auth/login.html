<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>EduRequest — Connexion</title>
  <link rel="stylesheet" href="../../assets/css/main.css" />
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <div class="login-header">
        <h1>🎓 EduRequest</h1>
        <p>Gestion des demandes étudiantes</p>
      </div>
      <form id="loginForm">
        <div class="form-group">
          <label for="matricule">INE</label>
          <input type="text" id="matricule" placeholder="Ex: N00222020241" required />
        </div>
        <div class="form-group">
          <label for="password">Mot de passe</label>
          <input type="password" id="password" placeholder="••••••••" required />
        </div>
        <button type="submit" class="btn-login">Se connecter</button>
        <p id="errorMsg" class="error-msg"></p>
      <p style="text-align:center; margin-top:14px; font-size:13px; color:#666;">
        Pas encore de compte ? 
        <a href="register.html" style="color:#1a237e; font-weight:600;">Créer un compte</a>
      </p>
      </form>
    </div>
  </div>
  <script src="../../assets/js/core/api.js"></script>
  <script src="../../assets/js/core/auth.js"></script>
  <script>
    document.getElementById('loginForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const email = document.getElementById('matricule').value;
      const password = document.getElementById('password').value;
      if (email && password) {
        login(email, password);
      } else {
        document.getElementById('errorMsg').textContent = 'Veuillez remplir tous les champs.';
      }
    });
  </script>
</body>
</html>
<script>
  document.getElementById('loginForm').addEventListener('submit', function(e) {
    e.preventDefault();
    const matricule = document.getElementById('matricule').value;
    const password = document.getElementById('password').value;
    if (matricule && password) {
      window.location.href = '../dashboard/etudiant.html';
    } else {
      document.getElementById('errorMsg').textContent = 'Veuillez remplir tous les champs.';
    }
  });
</script>
