<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>EduRequest — Inscription</title>
  <link rel="stylesheet" href="../../assets/css/main.css"/>
</head>
<body>
  <div class="login-container">
    <div class="login-card" style="max-width:480px;">
      <div class="login-header">
        <div style="font-size:48px; margin-bottom:8px;">🎓</div>
        <h1>EduRequest</h1>
        <p>Créer un compte étudiant</p>
      </div>
      <div class="form-group">
        <label>Nom et prénom(s)</label>
        <input type="text" placeholder="Ex: Koné Mamadou"/>
      </div>
      <div class="form-group">
        <label>Matricule</label>
        <input type="text" placeholder="Ex: 2024INF001"/>
      </div>
      <div class="form-group">
        <label>Email universitaire</label>
        <input type="email" placeholder="Ex: kone@esi.bf"/>
      </div>
      <div class="form-group">
        <label>Filière</label>
        <select>
          <option>-- Choisir --</option>
          <option>Analyse et Programmation (AP)</option>
          <option>Réseaux et Maintenance Informatique (RéMI)</option>
        </select>
      </div>
      <div class="form-group">
        <label>Niveau</label>
        <select>
          <option>L1</option><option>L2</option><option>L3</option>
          <option>M1</option><option>M2</option>
        </select>
      </div>
      <div class="form-group">
        <label>Mot de passe</label>
        <input type="password" placeholder="••••••••"/>
      </div>
      <div class="form-group">
        <label>Confirmer le mot de passe</label>
        <input type="password" placeholder="••••••••"/>
      </div>
      <button class="btn-login" onclick="inscrire()">Créer mon compte</button>
      <div id="successMsg" style="display:none; background:#e8f5e9; border:2px solid #2e7d32; border-radius:8px; padding:14px; text-align:center; margin-top:14px;">
        <p style="color:#2e7d32; font-weight:700; font-size:15px;">✅ Compte créé avec succès !</p>
        <p style="color:#555; font-size:13px; margin:6px 0 12px;">Vous pouvez maintenant vous connecter.</p>
        <a href="login.html" style="background:#2e7d32; color:white; padding:8px 20px; border-radius:8px; text-decoration:none; font-weight:600;">Se connecter</a>
      </div>
      <script>
        function inscrire() {
          const inputs = document.querySelectorAll("input, select");
          let valide = true;
          inputs.forEach(i => { if (!i.value) valide = false; });
          if (!valide) {
            alert("Veuillez remplir tous les champs.");
            return;
          }
          document.querySelector(".btn-login").style.display = "none";
          document.getElementById("successMsg").style.display = "block";
        }
      </script>
      <p style="text-align:center; margin-top:14px; font-size:13px; color:#666;">
        Déjà un compte ? <a href="login.html" style="color:#1a237e; font-weight:600;">Se connecter</a>
      </p>
    </div>
  </div>
</body>
</html>
