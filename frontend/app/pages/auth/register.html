<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>EduRequest — Inscription</title>
  <link rel="stylesheet" href="../../assets/css/main.css"/>
</head>
<body>
  <div class="login-container">
    <div class="login-card" style="max-width:480px;">
      <div class="login-header">
        <h1>🎓 EduRequest</h1>
        <p>Créer un compte étudiant</p>
      </div>
      <form id="registerForm">
        <div class="form-group">
          <label>Nom</label>
          <input type="text" id="nom" placeholder="Ex: Koné" required/>
        </div>
        <div class="form-group">
          <label>Prénom</label>
          <input type="text" id="prenom" placeholder="Ex: Mamadou" required/>
        </div>
        <div class="form-group">
          <label>INE</label>
          <input type="text" id="matricule" placeholder="Ex: N20240000001" required/>
        </div>
        <div class="form-group">
          <label>Filière</label>
          <select id="filiere" required>
            <option value="">-- Sélectionner --</option>
            <option value="Informatique">Informatique</option>
          </select>
        </div>
        <div class="form-group">
          <label>Niveau</label>
          <select id="niveau" required>
            <option value="">-- Sélectionner --</option>
            <option value="L1">L1</option>
            <option value="L2">L2</option>
            <option value="L3">L3</option>
            <option value="M1">M1</option>
            <option value="M2">M2</option>
          </select>
        </div>
        <div class="form-group">
          <label>Option</label>
          <select id="option">
            <option value="">-- Sélectionner --</option>
            <option value="Tronc commun 1">Tronc commun 1</option>
            <option value="Tronc commun 2">Tronc commun 2</option>
            <option value="Ingénierie des Systèmes d'Information">Ingénierie des Systèmes d'Information</option>
            <option value="Ingénierie des Réseaux et Systèmes">Ingénierie des Réseaux et Systèmes</option>
            <option value="Systèmes d'Aide à la Décision">Systèmes d'Aide à la Décision</option>
            <option value="Conception et Architecture des Réseaux">Conception et Architecture des Réseaux</option>
            <option value="Cybersécurité">Cybersécurité</option>
            <option value="Sciences des Données">Sciences des Données</option>
            <option value="Cybersécurité en Formation Continue">Cybersécurité en Formation Continue</option>
            <option value="Sciences des Données en Formation Continue">Sciences des Données en Formation Continue</option>
          </select>
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="email" placeholder="Ex: kone@esi.bf" required/>
        </div>
        <div class="form-group">
          <label>Téléphone</label>
          <input type="tel" id="telephone" placeholder="Ex: +226 XX XX XX XX"/>
        </div>
        <div class="form-group">
          <label>Mot de passe</label>
          <input type="password" id="mot_de_passe" placeholder="••••••••" required/>
        </div>
        <div class="form-group">
          <label>Confirmer le mot de passe</label>
          <input type="password" id="confirm_password" placeholder="••••••••" required/>
        </div>
        <button type="submit" class="btn-login">Créer mon compte</button>
        <p id="errorMsg" style="color:#c62828; font-size:13px; margin-top:10px; text-align:center;"></p>
        <div id="successMsg" style="display:none; background:#e8f5e9; border:2px solid #2e7d32; border-radius:8px; padding:14px; text-align:center; margin-top:14px;">
          <p style="color:#2e7d32; font-weight:700; font-size:15px;">✅ Compte créé avec succès !</p>
          <p style="color:#555; font-size:13px; margin:6px 0 12px;">Vous pouvez maintenant vous connecter.</p>
          <a href="login.html" style="background:#2e7d32; color:white; padding:8px 20px; border-radius:8px; text-decoration:none; font-weight:600;">Se connecter</a>
        </div>
        <p style="text-align:center; margin-top:14px; font-size:13px; color:#666;">
          Déjà un compte ? <a href="login.html" style="color:#1a237e; font-weight:600;">Se connecter</a>
        </p>
      </form>
    </div>
  </div>
  <script src="../../assets/js/core/api.js"></script>
  <script src="../../assets/js/core/auth.js"></script>
  <script>
    document.getElementById('registerForm').addEventListener('submit', async function(e) {
      e.preventDefault();

      const nom = document.getElementById('nom').value.trim();
      const prenom = document.getElementById('prenom').value.trim();
      const matricule = document.getElementById('matricule').value.trim();
      const email = document.getElementById('email').value.trim();
      const mot_de_passe = document.getElementById('mot_de_passe').value;
      const confirm_password = document.getElementById('confirm_password').value;
      const filiere = document.getElementById('filiere').value;
      const niveau = document.getElementById('niveau').value;
      const option = document.getElementById('option').value;
      const telephone = document.getElementById('telephone').value.trim();

      if (!nom || !prenom || !matricule || !email || !mot_de_passe) {
        document.getElementById('errorMsg').textContent = 'Veuillez remplir tous les champs.';
        return;
      }

      if (!filiere || !niveau) {
        document.getElementById('errorMsg').textContent = 'Veuillez sélectionner votre filière et votre niveau.';
        return;
      }

      // Validation INE : commence par N et 11 chiffres
      if (!/^N[0-9]{11}$/.test(matricule)) {
        document.getElementById('errorMsg').textContent = "L'INE doit commencer par N et contenir 11 chiffres (ex: N20240000001).";
        return;
      }

      if (mot_de_passe !== confirm_password) {
        document.getElementById('errorMsg').textContent = 'Les mots de passe ne correspondent pas.';
        return;
      }

      try {
        const data = await authAPI.register({ nom, prenom, matricule, email, mot_de_passe, filiere, niveau, option, telephone });

        if (data.success) {
          setAuthSession(data.token, data.user);
          window.location.href = '../dashboard/etudiant.html';
        } else {
          document.getElementById('errorMsg').textContent = data.message || 'Erreur lors de l\'inscription.';
        }
      } catch (error) {
        document.getElementById('errorMsg').textContent = 'Erreur de connexion au serveur.';
      }
    });
  </script>
</body>
</html>
